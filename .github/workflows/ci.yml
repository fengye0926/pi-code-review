name: ci

on:
  push:
  pull_request:

jobs:
  check-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package guardrails (frontmatter, no model bindings, counts, workflow syntax)
        run: node scripts/check-package.mjs --no-pi
